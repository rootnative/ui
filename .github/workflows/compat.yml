name: SDK Compatibility

# Checks the packed release candidate against every Expo SDK fixture in
# rootnative/sdk-compat, before it is published rather than after.
#
# components is the reason. It once advertised `react >=18.0.0` and
# `react-native >=0.72.0` while it depended on @rootnative/inertia, whose floor
# was higher. npm rejected the advertised floor with ERESOLVE, and that release
# was already published when the defect was found.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/compat.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/compat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    name: Pack candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # components ships `dist` only — its react-native export condition points
      # there — so the tarball must be built before it is packed.
      - name: Build
        run: pnpm run build

      # Pack from the package directory so the step does not depend on the
      # pnpm version: `pnpm --filter <pkg> pack` only exists in pnpm 10+.
      - name: Pack components
        working-directory: packages/components
        run: pnpm pack --pack-destination ../../pack

      - name: Upload candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: candidate-components
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  compat:
    name: Matrix
    needs: pack
    uses: rootnative/sdk-compat/.github/workflows/compat.yml@main
    with:
      package: '@rootnative/components'
      tarball-artifact: candidate-components
      # Enforced. The ranges were narrowed to the SDK 58 band, which is the
      # widest set that admits no combination npm would reject.
      enforce-range: true
