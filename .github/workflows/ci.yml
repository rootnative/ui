name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Docs check
        run: pnpm run docs:check

      # The inertia version is pinned in six places and CLAUDE.md warns that
      # missing one is silent — a lagging template pin makes every scaffolded
      # project install a floor the components do not satisfy. Needs no build.
      - name: Inertia pin check
        run: pnpm run check:inertia-pins

      - name: Build
        run: pnpm run build

      # Runs the snapshot script directly rather than `pnpm run api:check`,
      # which would rebuild — the Build step above already produced `dist/`.
      - name: API surface
        run: npx tsx scripts/build-api-surface.ts --check

      # Reads the built bundles, so it must follow Build. A duplicated context
      # is invisible to typecheck, to the tests (they import from `src/`, where
      # there is only ever one copy) and to the API surface snapshot — the
      # emitted layout is the only place it shows.
      - name: Singleton check
        run: pnpm run check:singletons

      # Also reads the built bundles, and for the same reason: the bundler
      # decides whether the Reanimated Babel plugin can workletize a hook call,
      # and it matches by callee name. `format: 'cjs'` + `splitting: true`
      # emitted `_reanimated.useAnimatedStyle.call(void 0, cb)`, which it cannot
      # see — so every animated component crashed on mount in alpha.10/alpha.11
      # while typecheck, 957 tests and the API snapshot all stayed green.
      - name: Worklet check
        run: pnpm run check:worklets
