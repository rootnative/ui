name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'example/**'
      - 'docs/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Build docs
        run: pnpm docs:build

      - name: Merge into single artifact
        run: |
          mkdir -p _site
          cp -r docs/build/. _site/

      - name: Add SPA fallback for demo routes
        run: |
          SCRIPT='<script>(function(){var p=window.location.pathname;if(p.startsWith("/ui/demo/")){var r=p.slice("/ui/demo/".length);sessionStorage.setItem("spa-redirect",r+window.location.search);window.location.replace("/ui/demo/")}})();</script>'
          sed -i "s|</head>|${SCRIPT}</head>|" _site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The export check in ci.yml reads the HTML and loads it in Chrome. Only the
  # live host proves that a crawler gets the page: the status code,
  # `robots.txt`, and the served head. Lighthouse runs on the deployed URLs
  # and fails the workflow below an SEO score of 100. The deploy has happened
  # by then; a red run is the signal. The run id busts the Pages edge cache,
  # which can hold the previous deploy for ten minutes. The ubuntu runner has
  # Chrome; Lighthouse comes from npx at the version the script pins.
  lighthouse:
    name: Lighthouse SEO on the live site
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Lighthouse SEO
        run: >
          node scripts/lighthouse-seo.mjs --bust ${{ github.run_id }}
          https://rootnative.github.io/ui/
          https://rootnative.github.io/ui/demo/
          https://rootnative.github.io/ui/demo/button
          https://rootnative.github.io/ui/demo/showcase/settings-screen
          https://rootnative.github.io/ui/demo/de/i18n
