name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'example/**'
      - 'docs/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Build docs
        run: pnpm docs:build

      - name: Merge into single artifact
        run: |
          mkdir -p _site
          cp -r docs/build/. _site/

      - name: Add SPA fallback for demo routes
        run: |
          SCRIPT='<script>(function(){var p=window.location.pathname;if(p.startsWith("/ui/demo/")){var r=p.slice("/ui/demo/".length);sessionStorage.setItem("spa-redirect",r+window.location.search);window.location.replace("/ui/demo/")}})();</script>'
          sed -i "s|</head>|${SCRIPT}</head>|" _site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
