name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      preid:
        description: 'Pre-release identifier (e.g. alpha, beta, rc). Only used with pre* version types.'
        required: false
        default: 'alpha'
        type: string
      tag:
        description: 'npm dist-tag'
        required: true
        type: choice
        options:
          - latest
          - alpha
          - beta
          - rc

# One release at a time, shared with release-manual.yml. No
# `cancel-in-progress`: a cancelled run can leave a version on npm with no tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ci.yml and compat.yml already run on each push to main. When they passed
  # on the commit that this run releases, the release reuses the results:
  # running them again took about six of the eight minutes of a release. A
  # failed run stops the release. A missing run, or a matrix result older
  # than a day, makes the release do that work itself in the `gates`, `pack`
  # and `compat` jobs. Keep the `verify` step "Find the CI and matrix results"
  # the same in release-manual.yml.
  verify:
    name: Checks on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    outputs:
      ci: ${{ steps.checks.outputs.ci }}
      compat: ${{ steps.checks.outputs.compat }}
    steps:
      - name: Find the CI and matrix results
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "<status> <conclusion> <updated_at>" of the newest push run of a
          # workflow on this commit, or nothing.
          latest_run() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.updated_at)"'
          }

          # Writes <key>=success or <key>=missing, or fails the job. It waits
          # for a run that has not finished, for up to 40 minutes.
          result_of() {
            local workflow=$1 key=$2 max_age_hours=$3
            for _ in $(seq 80); do
              read -r status conclusion updated_at <<< "$(latest_run "$workflow")"
              if [ -z "$status" ]; then
                echo "$workflow has no push run on this commit. The release runs it."
                echo "$key=missing" >> "$GITHUB_OUTPUT"
                return 0
              fi
              if [ "$status" != completed ]; then
                echo "$workflow is $status. Waiting."
                sleep 30
                continue
              fi
              case "$conclusion" in
                success)
                  age=$(( ($(date +%s) - $(date -d "$updated_at" +%s)) / 3600 ))
                  if [ -n "$max_age_hours" ] && [ "$age" -ge "$max_age_hours" ]; then
                    echo "$workflow passed $age hours ago. The release runs it again."
                    echo "$key=missing" >> "$GITHUB_OUTPUT"
                  else
                    echo "$workflow passed on this commit. The release reuses the result."
                    echo "$key=success" >> "$GITHUB_OUTPUT"
                  fi
                  return 0
                  ;;
                skipped)
                  echo "$workflow skipped every job on this commit. The release runs it."
                  echo "$key=missing" >> "$GITHUB_OUTPUT"
                  return 0
                  ;;
                *)
                  echo "::error::$workflow ended with '$conclusion' on this commit. Fix it or re-run it, then release."
                  return 1
                  ;;
              esac
            done
            echo "::error::$workflow did not finish in 40 minutes."
            return 1
          }

          result_of ci.yml ci ''
          # The matrix also reads sdk-compat main and the registry when it
          # runs, so an old result can miss a new fixture or a new peer release.
          result_of compat.yml compat 24

  # The gates of ci.yml, for a commit with no CI result on it to reuse.
  gates:
    name: Gates
    needs: verify
    if: needs.verify.outputs.ci != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Docs check
        run: pnpm run docs:check

      # `check-inertia-pins` reads the registry but only compares the inertia
      # floor in each entry, so the `files` lists were unguarded: 21 of 29 were
      # missing internal/pointerEvents.ts after somebody added the import
      # without re-running the generator. The registry is what `rootnative add`
      # copies into a consumer project, so a stale list hands them a component
      # with a missing import. Needs no build.
      - name: Registry drift check
        run: pnpm run registry:check

      - name: Inertia pin check
        run: pnpm run check:inertia-pins

      # The templates are not workspace members, so no install, typecheck or
      # test run ever reads their pins. They sat a whole Expo SDK behind the
      # library and every gate stayed green. Needs no build.
      - name: Template pin check
        run: pnpm run check:template-pins

      # The mark and the docs accent tokens hold the same hex values in two
      # files; the palette comment declares the CSS as the follower and nothing
      # checked it, so both themes had drifted by one rung of the ramp while the
      # token was unreferenced. Needs no build.
      - name: Brand accent check
        run: pnpm run check:brand-accent

  # The compat matrix gates the publish. compat.yml runs on push and pull
  # request only, so without this job a release can ship from a commit whose
  # matrix was red, or never ran. It runs when compat.yml has no recent result
  # on this commit to reuse. The candidate is the tree as dispatched, before
  # the version bump; the bump changes the version field and the
  # `@rootnative/core` floor, nothing the fixtures install differently.
  pack:
    name: Pack candidate
    needs: verify
    if: needs.verify.outputs.compat != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # components ships `dist` only, so the tarball must be built before it
      # is packed.
      - name: Build
        run: pnpm run build

      # Pack from the package directory; it works the same on every pnpm version.
      - name: Pack components
        working-directory: packages/components
        run: pnpm pack --pack-destination ../../pack

      # core releases with components, and the matrix installs every tarball
      # of the artifact. Without core here the cell takes the last core
      # release from the registry, which can declare the previous SDK band.
      - name: Pack core
        working-directory: packages/core
        run: pnpm pack --pack-destination ../../pack

      - name: Upload candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-candidate-components
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  # A push to main during this run starts compat.yml, and the two matrix runs
  # share one concurrency group in sdk-compat. If this job is cancelled, re-run
  # the release.
  compat:
    name: Matrix
    needs: pack
    uses: rootnative/sdk-compat/.github/workflows/compat.yml@main
    with:
      package: '@rootnative/components'
      tarball-artifact: release-candidate-components
      enforce-range: true

  release:
    name: Release
    needs: [verify, gates, pack, compat]
    # `gates`, `pack` and `compat` are skipped when the release reuses their
    # results. always() lets this job start after a skipped job, and the rest
    # of the condition still stops it after a failed or cancelled one.
    if: >-
      always() && needs.verify.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # pnpm before Node.js: the pnpm cache of setup-node needs pnpm on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Everything from here to `Configure git` mirrors the post-build gates in
      # ci.yml, and the mirroring is load-bearing: these checks read the built
      # output, which is the only place their failure modes are observable.
      # They run on this build every time, also when the release reuses the CI
      # result. Releasing without them is how alpha.10 and alpha.11 shipped
      # with every animated component dead on native — the worklet check existed
      # in CI, but the release path never ran it, so a green CI on main said
      # nothing about the artifact actually being published.
      #
      # Keep this list in sync with ci.yml. A guard that runs on PRs but not on
      # release protects the branch and not the users.
      - name: API surface
        run: npx tsx scripts/build-api-surface.ts --check

      - name: Singleton check
        run: pnpm run check:singletons

      - name: Worklet check
        run: pnpm run check:worklets

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Discover public packages
        id: packages
        run: |
          # Find all non-private packages under packages/
          PUBLIC_PKGS=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const dirs = fs.readdirSync('packages', { withFileTypes: true })
              .filter(d => d.isDirectory())
              .map(d => d.name)
              .filter(name => {
                const pkgPath = path.join('packages', name, 'package.json');
                if (!fs.existsSync(pkgPath)) return false;
                const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                return pkg.private !== true;
              });
            console.log(dirs.join(' '));
          ")
          echo "packages=$PUBLIC_PKGS" >> "$GITHUB_OUTPUT"
          echo "Discovered public packages: $PUBLIC_PKGS"

      - name: Bump versions
        id: version
        run: |
          VERSION_ARGS="${{ inputs.version }}"
          if [[ "$VERSION_ARGS" == pre* ]]; then
            VERSION_ARGS="$VERSION_ARGS --preid ${{ inputs.preid }}"
          fi

          NEW_VERSION=""
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            (cd "packages/$PKG_DIR" && npm version $VERSION_ARGS --no-git-tag-version)
            if [ -z "$NEW_VERSION" ]; then
              NEW_VERSION=$(node -p "require('./packages/$PKG_DIR/package.json').version")
            fi
          done

          # Update @rootnative/core peer dep in any package that references it
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            node -e "
              const fs = require('fs');
              const pkgPath = 'packages/$PKG_DIR/package.json';
              const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              if (pkg.peerDependencies?.['@rootnative/core']) {
                pkg.peerDependencies['@rootnative/core'] = '>=$NEW_VERSION';
                fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
              }
            "
          done

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Regenerate LLM docs with new versions
        run: npx tsx scripts/build-llms.ts

      # The registry derives its `@rootnative/core` floor from the components
      # peer range, which the bump above just moved — so it is generated output
      # that goes stale on every release unless it is regenerated here. It was:
      # alpha.10 and alpha.11 both shipped a registry still claiming
      # `>=0.0.0-alpha.9`, because only `llms.txt` was regenerated. The CLI
      # fetches `registry/index.json` from the release tag, so a stale floor
      # reaches every scaffolded project.
      - name: Regenerate registry with new versions
        run: npx tsx scripts/build-registry.ts

      - name: Commit and tag
        run: |
          git add packages/*/llms.txt docs/static/llms-full.txt
          git add registry
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            git add "packages/$PKG_DIR/package.json"
          done
          git commit -m "release: v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"

      # Push before publish. See the note in release-manual.yml.
      - name: Push to main
        run: |
          git push origin main
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Publish packages
        run: |
          # Publish core first (other packages may depend on it)
          if [ -d packages/core ]; then
            echo "Publishing @rootnative/core..."
            (cd packages/core && pnpm publish --provenance --access public --tag ${{ inputs.tag }} --no-git-checks)
          fi

          # Publish remaining packages
          for PKG_DIR in ${{ steps.packages.outputs.packages }}; do
            if [ "$PKG_DIR" = "core" ]; then continue; fi
            PKG_NAME=$(node -p "require('./packages/$PKG_DIR/package.json').name")
            echo "Publishing $PKG_NAME..."
            (cd "packages/$PKG_DIR" && pnpm publish --provenance --access public --tag ${{ inputs.tag }} --no-git-checks)
          done

      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ inputs.tag }}" != "latest" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${{ steps.version.outputs.version }}" --generate-notes $PRERELEASE_FLAG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
