name: EAS Update

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "example/**"
      - "pnpm-lock.yaml"

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Publish update
        working-directory: example
        run: eas update --channel main --message "${{ github.event.head_commit.message }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
