name: EAS Update

on:
  push:
    branches:
      - main
    # Only the files that reach the native bundle. The example scripts and
    # the seo Node tools run in CI and in the web export, not on a device.
    # Run the workflow by hand after an edit to this file.
    paths:
      - 'example/**'
      - '!example/scripts/**'
      - '!example/public/**'
      - 'packages/components/**'
      - 'packages/core/**'
      - 'packages/utils/**'
      - 'packages/seo/**'
      - '!packages/seo/src/node/**'
      - '!packages/**/__tests__/**'
      - '!packages/**/jest.*'
      - '!packages/**/*.md'
      - '!packages/**/llms.txt'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Publish update
        working-directory: example
        # The commit message goes through `env`, not into the script text. A
        # message that holds `"` or `$(...)` then stays data and cannot run.
        run: eas update --channel main --message "$COMMIT_MESSAGE"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
